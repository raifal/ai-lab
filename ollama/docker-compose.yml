services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
#    ports:
#      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Reicht die Intel Arc iGPU Gerätedateien durch:
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "990"  # 'render' GID
      - "44"   # 'video' GID
    restart: unless-stopped
    environment:
      - OLLAMA_IGPU_ENABLE=true
      - OLLAMA_VULKAN=true
      # FLASH ATTENTION SCHNELLMACHEN:
      - OLLAMA_FLASH_ATTENTION=true
      # PARALLELE CONTEXT-VERARBEITUNG REDUZIEREN (spart VRAM-Bandbreite):
      - OLLAMA_NUM_PARALLEL=1
    networks:
      - m1net
    # Für NVIDIA-GPU einkommentieren:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
#    ports:
#      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_URL_PREFIX=/
    volumes:
      - open-webui_data:/app/backend/data
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - m1net

volumes:
  ollama_data:
  open-webui_data:

networks:
  m1net:
    external: true
