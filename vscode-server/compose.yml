services:

  openvscode:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: openvscode
    restart: unless-stopped

    environment:
      TZ: Europe/Berlin

    ports:
      - "3333:3000"

    volumes:
      # Deine Projekte
      - ./workspace:/home/workspace

      # Persistente SSH-Keys für GitHub
      - ./ssh:/home/workspace/.ssh

    networks:
      - m1net


