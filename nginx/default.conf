# ----------------------------------------------------
# Subdomain: chat.m1 (Open-WebUI)
# ----------------------------------------------------
server {
    listen 80;
    server_name chat.m1;

    # Weiterleitung auf HTTPS (optional/empfohlen, falls TLS eingerichtet ist)
    # return 301 https://$host$request_uri;

    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/m1.crt;
    ssl_certificate_key /etc/nginx/certs/m1.key;

    client_max_body_size 500M; # Erlaubt größere Uploads/Files

    location / {
        proxy_pass http://open-webui:8080;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts für lange KI-Antworten/Streaming erhöhen
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# ----------------------------------------------------
# Subdomain: n8n.m1 (n8n Automation)
# ----------------------------------------------------
server {
    listen 80;
    server_name n8n.m1;

    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/m1.crt;
    ssl_certificate_key /etc/nginx/certs/m1.key;

    client_max_body_size 100M;

    location / {
        proxy_pass http://n8n:5678;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chunking / Buffering deaktivieren für Server-Sent Events (SSE)
        proxy_buffering off;
        proxy_cache off;
    }
}
